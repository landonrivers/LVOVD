[package]
name = "lvovd-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "lvovd-desktop"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
test-driver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
lvovd-core = { path = "../crates/lvovd-core" }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
