[workspace]
members = ["crates/lvovd-core", "src-tauri"]
default-members = ["crates/lvovd-core"]
resolver = "2"

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
http = "=1.5.0"
tempfile = "=3.27.0"
