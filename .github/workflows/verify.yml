name: LVOVD Verify

on:
  push:
    branches:
      - master
      - roadmap/7-local-convert-staging
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - roadmap/7-local-convert-staging
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install development test dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Install required local-media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg strace
          npm run update-ytdlp

      - name: Verify real local-media and isolated yt-dlp boundaries
        env:
          LVOVD_TRACE_LOCAL_INPUT: '1'
        run: npm run test:media

      - name: Install Chromium for the local-workflow browser tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify the local workflow in Chromium
        run: npm run test:browser

  windows-launcher:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Windows launcher and yt-dlp manager
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Windows launcher, yt-dlp manager, and workspace cleanup behavior
        run: node --test test/launcher.test.js test/ytdlp-manager.test.js test/local-media-input.test.js test/ytdlp-isolation.test.js test/media-workspace.test.js test/media-workspace-api.test.js test/workspace-cleanup.test.js test/media-inspection.test.js test/ffmpeg-capabilities.test.js test/conversion-compatibility.test.js test/conversion-assessment.test.js test/conversion-workspace.test.js test/conversion-ui.test.js test/conversion-plan.test.js test/conversion-lifecycle.test.js test/edited-conversion.test.js test/processing-plan.test.js test/processing-workspace.test.js test/processing-profile.test.js
