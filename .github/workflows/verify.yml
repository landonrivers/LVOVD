name: LVOVD Verify

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run checks and tests
        run: npm run check

  windows-launcher:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Windows launcher and yt-dlp manager
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Windows launcher and yt-dlp manager behavior
        run: node --test test/launcher.test.js test/ytdlp-manager.test.js
