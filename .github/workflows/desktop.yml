name: Desktop foundation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native playback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux build and playback prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev ffmpeg xvfb gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - run: npm ci
      - name: Rust formatting
        run: npm run fmt:desktop
      - name: Rust checks
        run: npm run check:desktop
      - name: Ownership, protocol and tool execution tests
        run: npm run test:desktop:core
      - name: Build native test application
        run: node scripts/desktop.cjs build --features test-driver
      - name: Native media gate
        if: runner.os != 'Linux'
        run: npm run test:desktop:native
      - name: Native media gate (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:native
      - name: Build without test controls
        run: node scripts/desktop.cjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            desktop/test-results/*.png
            desktop/test-results/*.log
          retention-days: 14
