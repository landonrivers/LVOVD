name: Desktop foundation

on:
  pull_request:
    branches: [master, staging/v3-desktop]
  push:
    branches: [master, staging/v3-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Feature preservation contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate inventory, released references and release readiness
        run: node scripts/check-feature-parity.cjs --baseline-files
      - name: Prevent silent loss against base and previous head
        env:
          PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PARITY_PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          for revision in "$PARITY_BASE_SHA" "$PARITY_PREVIOUS_SHA"; do
            if [[ -n "$revision" && "$revision" != 0000000000000000000000000000000000000000 ]]; then
              node scripts/check-feature-parity.cjs --base-ref "$revision"
            fi
          done
      - name: Exercise invalid evidence and release-blocking cases
        run: node --test test/feature-parity.test.js

  native:
    name: Native playback (${{ matrix.os }})
    needs: parity
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux build and playback prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Hosted LLVM headers conflict with Ubuntu's GStreamer development dependency.
          # https://github.com/actions/runner-images/issues/9546
          mapfile -t llvm_unwind < <(dpkg-query -W -f='${binary:Package}\n' 'libunwind-*-dev' 2>/dev/null || true)
          if ((${#llvm_unwind[@]})); then sudo apt-get remove -y "${llvm_unwind[@]}"; fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev nasm libx264-dev libopus-dev libmp3lame-dev xvfb dbus-x11 gstreamer1.0-tools gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Cache pinned Linux media tools
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: outputs/ci-ffmpeg
          key: ffmpeg-ubuntu-22.04-x64-${{ hashFiles('scripts/ci-ffmpeg-linux.sh') }}
      - name: Build verified Linux media tools
        if: runner.os == 'Linux'
        run: bash scripts/ci-ffmpeg-linux.sh
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Resolve pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.os }}
          cache-on-failure: true
      - run: npm ci
      - name: Rust formatting
        run: npm run fmt:desktop
      - name: Rust checks
        run: npm run check:desktop
      - name: Ownership, protocol and tool execution tests
        run: npm run test:desktop:core
      - name: Direct-launch tool discovery
        run: npm run test:desktop:host
      - name: Build native test application
        run: node scripts/desktop.cjs build --features test-driver
      - name: Native media gate
        if: runner.os != 'Linux'
        run: npm run test:desktop:native
      - name: Native media gate (Linux)
        if: runner.os == 'Linux'
        env:
          # Hosted Xvfb has no GPU; keep this setting out of the application.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GST_DEBUG: '2'
        run: xvfb-run -a dbus-run-session -- npm run test:desktop:native
      - name: Build without test controls
        run: node scripts/desktop.cjs build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            desktop/test-results/*.png
            desktop/test-results/*.log
          retention-days: 14
