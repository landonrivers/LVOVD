name: Temporary HTTP containment transfer

on:
  push:
    branches:
      - agent/http-request-containment

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/http-request-containment
      - name: Reconstruct verified app-server edit
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64

          path = Path('app-server.js')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, got {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once("const http = require('node:http');\n", "")
          replace_once("const remoteSourceRequests = createSourceRequestCoordinator();\nlet ytdlpLoadError = null;\n", "const remoteSourceRequests = createSourceRequestCoordinator();\n")
          replace_once("""function resolveYtdlpPath() {
  if (process.env.YTDLP_PATH) return process.env.YTDLP_PATH;
  try {
    const { YtDlp } = require('ytdlp-nodejs');
    return new YtDlp().binaryPath || '';
  } catch (error) {
    ytdlpLoadError = error;
    return '';
  }
}

const YTDLP_PATH = resolveYtdlpPath();
""", "const YTDLP_PATH = process.env.YTDLP_PATH || '';\n")
          replace_once("""      reject(new Error(ytdlpLoadError
        ? `yt-dlp npm dependency is not ready: ${ytdlpLoadError.message}`
        : 'yt-dlp npm dependency is not ready. Run npm install.'));
""", "      reject(new Error('LVOVD-managed yt-dlp is not ready. Start LVOVD through server.js.'));\n")
          replace_once("""        fail(new Error(isYtdlp
          ? 'The npm-managed yt-dlp binary is missing. Run npm install (or npm rebuild ytdlp-nodejs).'
          : `${command} is not installed or is not on PATH.`));
""", """        fail(new Error(isYtdlp
          ? 'The configured yt-dlp binary is missing. Restart LVOVD or run npm run update-ytdlp.'
          : `${command} is not installed or is not on PATH.`));
""")
          replace_once("""      reject(error.code === 'ENOENT'
        ? new Error('The npm-managed yt-dlp binary is missing. Run npm install (or npm rebuild ytdlp-nodejs).')
        : error);
""", """      reject(error.code === 'ENOENT'
        ? new Error('The configured yt-dlp binary is missing. Restart LVOVD or run npm run update-ytdlp.')
        : error);
""")
          replace_once("if (!YTDLP_PATH) throw new Error('The npm-managed yt-dlp binary is not ready. Run npm install.');", "if (!YTDLP_PATH) throw new Error('LVOVD-managed yt-dlp is not ready. Start LVOVD through server.js.');")

          anchor = "setInterval(() => cleanupExpiredJobs().catch(() => {}), 10 * 60 * 1000).unref();\n"
          index = text.find(anchor)
          if index == -1:
              raise SystemExit('tail anchor not found')
          tail = base64.b64decode('').decode()
          text = text[:index] + tail
          path.write_text(text)
          PYCODE
          actual="$(git hash-object app-server.js)"
          test "$actual" = "6dd28159505d4ddddb1dc9f30ee78cce700062e6" || { echo "unexpected app-server blob: $actual"; exit 1; }
      - name: Commit transfer result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-server.js
          git commit -m "Temporary HTTP containment transfer"
          git push origin HEAD:agent/http-request-containment
