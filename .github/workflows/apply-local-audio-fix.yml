name: Apply local audio conversion fix

on:
  push:
    branches:
      - fix/local-audio-conversion

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-audio-conversion

      - name: Apply audio conversion patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('app-server.js')
          s = app.read_text()

          old = """    if (options.content === 'av') {
                args.push('--merge-output-format', 'mp4', '--remux-video', 'mp4');
              } else if (options.content === 'video') {
                args.push('--remux-video', 'mp4');
              } else if (options.content === 'audio' && options.audioFormat !== 'source') {
                args.push('--extract-audio', '--audio-format', options.audioFormat, '--audio-quality', '0');
              }
          """
          new = """    if (options.content === 'av') {
                args.push('--merge-output-format', 'mp4', '--remux-video', 'mp4');
              } else if (options.content === 'video') {
                args.push('--remux-video', 'mp4');
              }
          """
          if old not in s:
              if "--extract-audio', '--audio-format'" not in s:
                  print('Audio acquisition patch already present')
              else:
                  raise SystemExit('Expected yt-dlp audio post-processing block not found')
          else:
              s = s.replace(old, new, 1)

          marker = "function outputMime(filename) {\n"
          helper = r"""function audioConversionArgs(inputPath, outputPath, format) {
            const base = ['-y', '-hide_banner', '-loglevel', 'error', '-i', inputPath, '-map', '0:a:0', '-vn'];
            if (format === 'm4a') return [...base, '-c:a', 'aac', '-b:a', '256k', '-movflags', '+faststart', outputPath];
            if (format === 'mp3') return [...base, '-c:a', 'libmp3lame', '-q:a', '0', outputPath];
            if (format === 'opus') return [...base, '-c:a', 'libopus', '-b:a', '192k', '-vbr', 'on', outputPath];
            if (format === 'flac') return [...base, '-c:a', 'flac', outputPath];
            if (format === 'wav') return [...base, '-c:a', 'pcm_s16le', outputPath];
            throw new Error(`Unsupported audio conversion format: ${format}`);
          }

          async function findDownloadedMediaFile(taskDir) {
            const files = await walkFiles(taskDir);
            const mediaFiles = files.filter((filePath) => {
              const name = path.basename(filePath);
              if (/\.(part|ytdl|temp)$/i.test(name)) return false;
              return classifyOutput(filePath)?.kind === 'media';
            });
            if (mediaFiles.length === 1) return mediaFiles[0];
            if (!mediaFiles.length) throw new Error('yt-dlp completed but did not produce a source audio file.');
            throw new Error('yt-dlp produced multiple media files, so LVOVD could not safely choose which one to convert.');
          }

          async function convertDownloadedAudio(job, taskDir, format) {
            const sourcePath = await findDownloadedMediaFile(taskDir);
            const sourceExt = path.extname(sourcePath);
            const stem = path.basename(sourcePath, sourceExt);
            const finalPath = path.join(path.dirname(sourcePath), `${stem}.${format}`);
            const tempPath = path.join(path.dirname(sourcePath), `${stem}.lvovd-converting.${format}`);
            const formatNames = {
              m4a: 'M4A / AAC',
              mp3: 'MP3',
              opus: 'Opus',
              flac: 'FLAC',
              wav: 'WAV'
            };

            updateJob(job, {
              status: 'running',
              phase: 'processing',
              message: `Converting source audio to ${formatNames[format] || format} with FFmpeg…`,
              streamLabel: null,
              percent: null,
              speed: null,
              eta: null
            });

            await new Promise((resolve, reject) => {
              const child = spawn('ffmpeg', audioConversionArgs(sourcePath, tempPath, format), {
                windowsHide: true,
                shell: false
              });
              job.child = child;
              const stderr = [];
              let stderrBytes = 0;

              child.stderr.on('data', (chunk) => {
                stderrBytes += chunk.length;
                if (stderrBytes <= 512 * 1024) stderr.push(chunk);
              });

              child.on('error', (error) => {
                job.child = null;
                reject(error.code === 'ENOENT'
                  ? new Error('FFmpeg is not installed or is not on PATH.')
                  : error);
              });

              child.on('close', (code) => {
                job.child = null;
                if (code === 0) return resolve();
                const detail = Buffer.concat(stderr).toString('utf8').trim().split(/\r?\n/).filter(Boolean).slice(-1)[0];
                reject(new Error(detail || `FFmpeg audio conversion exited with code ${code}.`));
              });
            });

            await fsp.rm(sourcePath, { force: true });
            if (finalPath !== sourcePath) await fsp.rm(finalPath, { force: true });
            await fsp.rename(tempPath, finalPath);
            return finalPath;
          }

          """
          if 'function audioConversionArgs(' not in s:
              if marker not in s:
                  raise SystemExit('outputMime marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = """  const outputs = await collectTaskOutputs(taskDir, task.label);
            if (!outputs.length) throw new Error('yt-dlp completed but did not produce a downloadable file.');
            job.outputs.push(...outputs);
          }
          """
          new = """  if (options.content === 'audio' && options.audioFormat !== 'source') {
              await convertDownloadedAudio(job, taskDir, options.audioFormat);
            }

            const outputs = await collectTaskOutputs(taskDir, task.label);
            if (!outputs.length) throw new Error('yt-dlp completed but did not produce a downloadable file.');
            job.outputs.push(...outputs);
          }
          """
          if old in s:
              s = s.replace(old, new, 1)
          elif 'await convertDownloadedAudio(job, taskDir, options.audioFormat);' not in s:
              raise SystemExit('runTask output collection block not found')

          old = """  formatSelector,
            buildYtdlpArgs,
            resolveTasks,
          """
          new = """  formatSelector,
            buildYtdlpArgs,
            audioConversionArgs,
            resolveTasks,
          """
          if old in s:
              s = s.replace(old, new, 1)
          elif 'audioConversionArgs,' not in s:
              raise SystemExit('module export block not found')

          app.write_text(s)

          tests = Path('test/options.test.js')
          t = tests.read_text()
          old = """  formatSelector,
            buildYtdlpArgs
          """
          new = """  formatSelector,
            buildYtdlpArgs,
            audioConversionArgs
          """
          if old in t:
              t = t.replace(old, new, 1)

          extra = r"""

          test('audio conversion choices keep yt-dlp acquisition identical to Source Audio', () => {
            for (const audioFormat of ['m4a', 'mp3', 'opus', 'flac', 'wav']) {
              const options = normalizeOptions({ content: 'audio', audioFormat });
              assert.equal(formatSelector(options), 'bestaudio');
              const args = buildYtdlpArgs(
                { url: 'https://video.example/watch/ABCDEFGHIJK' },
                options,
                '/tmp/%(title)s.%(ext)s',
                'download:test'
              );
              assert.equal(args.includes('--extract-audio'), false);
              assert.equal(args.includes('--audio-format'), false);
              assert.equal(args.includes('--audio-quality'), false);
            }
          });

          test('local FFmpeg conversion uses high-quality MP3 and compatible AAC settings', () => {
            const mp3 = audioConversionArgs('/tmp/source.webm', '/tmp/output.mp3', 'mp3');
            assert.deepEqual(mp3.slice(-5), ['-c:a', 'libmp3lame', '-q:a', '0', '/tmp/output.mp3']);

            const m4a = audioConversionArgs('/tmp/source.webm', '/tmp/output.m4a', 'm4a');
            assert.ok(m4a.includes('aac'));
            assert.ok(m4a.includes('256k'));
            assert.equal(m4a.at(-1), '/tmp/output.m4a');
          });
          """
          if "audio conversion choices keep yt-dlp acquisition identical" not in t:
              t = t.rstrip() + extra + '\n'
          tests.write_text(t)

          index = Path('public/index.html')
          h = index.read_text()
          old = "M4A/AAC is broadly compatible. Source Audio keeps the source service's native audio codec without conversion."
          new = "M4A/AAC is broadly compatible. LVOVD downloads the best source audio first, then converts non-source formats locally with FFmpeg. Source Audio skips conversion."
          if old in h:
              h = h.replace(old, new, 1)
          index.write_text(h)

          for filename in ('package.json', 'package-lock.json'):
              p = Path(filename)
              data = json.loads(p.read_text())
              data['version'] = '2.2.2'
              if filename == 'package-lock.json':
                  data['packages']['']['version'] = '2.2.2'
              p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "Landon Rivers"
          git config user.email "81066018+landonrivers@users.noreply.github.com"
          git add app-server.js public/index.html test/options.test.js package.json package-lock.json
          git commit -m "Fix local audio conversion pipeline"
          git push origin HEAD:fix/local-audio-conversion
