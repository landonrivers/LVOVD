name: Bug report
description: Report a reproducible problem with LVOVD.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not paste cookies, tokens, passwords, private URLs, real media URLs or titles, channel/account names, post/video IDs, or other identifiable source-content details.** Security vulnerabilities should be reported privately according to `SECURITY.md`.
  - type: input
    id: version
    attributes:
      label: LVOVD version / commit
      placeholder: v2.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.x.x
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version
      placeholder: Output from ffmpeg -version (first line is enough)
    validations:
      required: true
  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      placeholder: Version shown by LVOVD
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source/service and URL shape
      description: Name the service and describe only the generic URL shape if useful. Never post the real media URL, title, account/channel name, or media identifier.
      placeholder: Example service / https://service.example/media/...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start LVOVD
        2. Paste an authorized test URL
        3. Choose the relevant options
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error
      description: Paste only non-sensitive error text. Remove usernames, local paths, cookies, tokens, real media titles/URLs/IDs, account/channel names, and other identifying source details.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I confirmed this report does not contain cookies, tokens, passwords, or other secrets.
          required: true
        - label: I confirmed this report does not identify the specific source media or account through a real title, URL, ID, channel/account name, screenshot, or log excerpt.
          required: true
        - label: This is a normal bug report, not a security vulnerability that should be reported privately.
          required: true
        - label: I am using LVOVD only with media I am authorized to access/download.
          required: true
